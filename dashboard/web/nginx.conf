# Karna dashboard — static frontend server.
# Hardened: strict CSP (no inline/eval scripts, no external origins), SPA
# fallback, and a same-origin /api reverse-proxy to the FastAPI backend so the
# browser only ever talks to this origin.
#
# Security headers live in security-headers.conf and are `include`d inside every
# location: nginx drops inherited add_header directives in any location that
# declares its own, so server-level headers alone would silently vanish.

# Credential endpoints: a first, coarse rate limit in front of the backend's
# own per-client lockout (this file is included in the http context).
limit_req_zone $binary_remote_addr zone=karna_auth:1m rate=10r/m;

# Strict-Transport-Security, sent only behind an HTTPS reverse proxy.
map $http_x_forwarded_proto $karna_hsts {
    https   "max-age=31536000";
    default "";
}

server {
    listen       8080;
    server_name  _;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed, content-addressed assets — safe to cache forever.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy to the backend, resolved at request time via the Docker embedded DNS
    # so nginx starts even when the backend is absent. X-Real-IP carries the
    # connecting address for the backend's logs; X-Forwarded-For is
    # overwritten, never appended, so a client cannot inject its own value.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream "http://dashboard-api:8080";
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    # The assistant streams NDJSON while the model writes: no buffering, and a
    # read timeout that covers a slow model (the backend gives up at 90 s).
    location = /api/assistant/chat {
        include /etc/nginx/security-headers.conf;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream "http://dashboard-api:8080";
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location ~ ^/api/auth/(login|register|password)$ {
        include /etc/nginx/security-headers.conf;
        limit_req zone=karna_auth burst=10 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream "http://dashboard-api:8080";
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    # SPA fallback — index.html must never be cached.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
